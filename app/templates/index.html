<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Smart Travel Planner</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header>
    <h1>🧭 Smart Travel Planner</h1>
    <div class="header-right">
      <input id="user_id" placeholder="user id" value="alice" />
      <button id="new-chat" type="button">+ New chat</button>
      <small id="session-info">no session</small>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <h2>Past chats</h2>
      <ul id="sessions-list"></ul>
      <h2 style="margin-top:18px;">Memory</h2>
      <div id="prefs-panel">
        <em id="prefs-empty">No preferences yet — mention things you like and the agent will remember.</em>
        <ul id="prefs-list" style="display:none;"></ul>
      </div>
    </aside>

    <main id="chat">
      <div id="messages" aria-live="polite"></div>
      <form id="composer">
        <textarea id="prompt" placeholder="Plan me a 5-day Japan trip under $2000…" rows="2"></textarea>
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    let sessionId = null;

    function userId() {
      return $("user_id").value.trim() || "anon";
    }

    function clearMessages() {
      $("messages").innerHTML = "";
    }

    function renderMessage(m) {
      const div = document.createElement("div");
      div.className = `msg msg-${m.role}`;
      const role = document.createElement("strong");
      role.textContent = m.role;
      const text = document.createTextNode(`: ${m.content}`);
      div.appendChild(role);
      div.appendChild(text);
      $("messages").appendChild(div);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    async function refreshSessions() {
      const list = $("sessions-list");
      list.innerHTML = "";
      const r = await fetch(`/sessions?user_id=${encodeURIComponent(userId())}`);
      if (!r.ok) return;
      const sessions = await r.json();
      for (const s of sessions) {
        const li = document.createElement("li");
        li.dataset.sessionId = s.id;
        li.textContent = s.title || `session #${s.id}`;
        if (s.id === sessionId) li.classList.add("active");
        li.addEventListener("click", () => loadSession(s.id));
        list.appendChild(li);
      }
    }

    async function refreshPreferences() {
      const r = await fetch(`/users/${encodeURIComponent(userId())}/preferences`);
      if (!r.ok) return;
      const { preferences } = await r.json();
      const list = $("prefs-list");
      const empty = $("prefs-empty");
      list.innerHTML = "";
      const keys = Object.keys(preferences || {});
      if (!keys.length) {
        empty.style.display = "";
        list.style.display = "none";
        return;
      }
      empty.style.display = "none";
      list.style.display = "";
      for (const k of keys) {
        const li = document.createElement("li");
        const strong = document.createElement("strong");
        strong.textContent = k + ": ";
        li.appendChild(strong);
        const val = preferences[k];
        li.appendChild(
          document.createTextNode(typeof val === "string" ? val : JSON.stringify(val))
        );
        list.appendChild(li);
      }
    }

    async function loadSession(sid) {
      const r = await fetch(`/sessions/${sid}?user_id=${encodeURIComponent(userId())}`);
      if (!r.ok) {
        renderMessage({ role: "system", content: `cannot load session ${sid}: ${r.status}` });
        return;
      }
      const s = await r.json();
      sessionId = s.id;
      $("session-info").textContent = `session #${s.id}`;
      clearMessages();
      for (const m of s.messages) renderMessage(m);
      refreshSessions();
    }

    async function newSession() {
      const r = await fetch("/sessions", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId() }),
      });
      const s = await r.json();
      sessionId = s.id;
      $("session-info").textContent = `session #${s.id}`;
      clearMessages();
      refreshSessions();
      return s.id;
    }

    async function ensureSession() {
      if (sessionId) return sessionId;
      return await newSession();
    }

    $("new-chat").addEventListener("click", () => newSession());
    $("user_id").addEventListener("change", () => {
      sessionId = null;
      $("session-info").textContent = "no session";
      clearMessages();
      refreshSessions();
      refreshPreferences();
    });

    $("composer").addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = $("prompt").value.trim();
      if (!content) return;
      const sid = await ensureSession();
      $("prompt").value = "";

      // Echo the user's message immediately
      renderMessage({ role: "user", content });

      // Lazy-create the assistant bubble on the first token. This keeps tool
      // bubbles ordered correctly: tool_call → assistant token → tool_result …
      let assistantBody = null;
      function appendAssistantText(text) {
        if (!assistantBody) {
          const div = document.createElement("div");
          div.className = "msg msg-assistant";
          const strong = document.createElement("strong");
          strong.textContent = "assistant";
          div.appendChild(strong);
          div.appendChild(document.createTextNode(": "));
          assistantBody = document.createElement("span");
          div.appendChild(assistantBody);
          $("messages").appendChild(div);
        }
        assistantBody.textContent += text;
      }

      // Stream from POST /sessions/{id}/plan/stream — SSE, one event per "data: {json}" line.
      const r = await fetch(
        `/sessions/${sid}/plan/stream?user_id=${encodeURIComponent(userId())}`,
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ goal: content }),
        }
      );
      if (!r.ok || !r.body) {
        appendAssistantText(`(error: ${r.status})`);
        return;
      }
      const reader = r.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n\n");
        buf = lines.pop() || "";
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          let evt;
          try { evt = JSON.parse(line.slice(6)); } catch { continue; }
          if (evt.type === "token") {
            appendAssistantText(evt.delta);
          } else if (evt.type === "plan") {
            // Show sub-tasks as a collapsed-style trace bubble, not as the assistant message
            const planDiv = document.createElement("div");
            planDiv.className = "msg msg-plan";
            const strong = document.createElement("strong");
            strong.textContent = "plan";
            planDiv.appendChild(strong);
            planDiv.appendChild(document.createTextNode(": " + evt.subtasks.join(" → ")));
            $("messages").appendChild(planDiv);
          } else if (evt.type === "tool_call") {
            const toolDiv = document.createElement("div");
            toolDiv.className = "msg msg-tool";
            toolDiv.textContent = `🔧 ${evt.name}(${JSON.stringify(evt.arguments)})`;
            $("messages").appendChild(toolDiv);
          } else if (evt.type === "tool_result") {
            const toolDiv = document.createElement("div");
            toolDiv.className = "msg msg-tool";
            toolDiv.textContent = `↳ ${evt.name} → ${JSON.stringify(evt.result).slice(0, 200)}`;
            $("messages").appendChild(toolDiv);
          } else if (evt.type === "done") {
            if (evt.truncated) {
              appendAssistantText("\n(plan truncated — agent ran out of steps)");
            }
          }
          $("messages").scrollTop = $("messages").scrollHeight;
        }
      }
      refreshSessions();
      refreshPreferences();
    });

    // Initial load
    refreshSessions();
    refreshPreferences();
  </script>
</body>
</html>
